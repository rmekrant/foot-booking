services:
  postgres:
    image: postgres:17
    container_name: footbooking-db
    environment:
      POSTGRES_DB: footbooking
      POSTGRES_USER: footbooking
      POSTGRES_PASSWORD: footbooking   # mot de passe de dev uniquement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footbooking -d footbooking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: